<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login</title>
  <style>
    body { font-family: system-ui; background: #0f172a; color: #e5e7eb; display: grid; place-content: center; min-height: 100vh; margin: 0; }
    .card { background: #111827; padding: 2rem; border-radius: 14px; width: 300px; border: 1px solid #1f2937; }
    input { width: 100%; padding: 10px; margin-bottom: 10px; border-radius: 8px; border: 1px solid #1f2937; background: #0b1020; color: #e5e7eb; }
    button { width: 100%; padding: 10px; border-radius: 8px; border: 0; background: #22d3ee; color: #001018; font-weight: 700; cursor: pointer; }
    p { color: #ef4444; font-size: 14px; }
  </style>
</head>
<body>
  <div class="card">
    <h3>Admin Login</h3>
    <input id="password" type="password" placeholder="Password" />
    <button id="loginBtn">Log In</button>
    <p id="error-msg"></p>
  </div>

  <script>
    // Use the same API_BASE logic from your other pages
    const API_BASE = location.hostname === 'localhost' || location.hostname === '127.0.0.1'
      ? 'http://localhost:4000'
      : 'https://your-app-server.onrender.com'; // <-- ⚠️ PASTE YOUR LIVE SERVER URL

    const loginBtn = document.getElementById('loginBtn');
    const passwordInput = document.getElementById('password');
    const errorMsg = document.getElementById('error-msg');

    loginBtn.addEventListener('click', async () => {
      errorMsg.textContent = '';
      const password = passwordInput.value;

      try {
        const res = await fetch(`${API_BASE}/api/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password })
        });

        const data = await res.json();
        
        if (!res.ok) {
          throw new Error(data.error || 'Login failed');
        }

        // Login successful, save the token
        localStorage.setItem('accessToken', data.accessToken);
        
        // Redirect to the dashboard
        window.location.href = '/images.html';

      } catch (err) {
        errorMsg.textContent = err.message;
      }
    });

    // Allow pressing Enter to log in
    passwordInput.addEventListener('keyup', (e) => {
      if (e.key === 'Enter') loginBtn.click();
    });
  </script>
</body>
</html>
