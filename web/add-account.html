<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IG Account Admin</title>
  <style>
    :root { --light-gray: #f0f2f5; --border-color: #d9d9d9; --text-color: #333; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--light-gray);
      color: var(--text-color);
      margin: 0;
      padding: 2rem;
    }
    .container {
      max-width: 800px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 1fr 2fr;
      gap: 2rem;
    }
    .panel {
      background: #fff;
      padding: 1.5rem;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.07);
    }
    h1, h2 { text-align: center; margin-top: 0; }
    .form-group { margin-bottom: 1rem; }
    label { display: block; margin-bottom: 0.5rem; font-weight: 600; }
    input {
      width: 100%;
      padding: 0.75rem;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      box-sizing: border-box;
      font-size: 1rem;
    }
    button {
      width: 100%;
      padding: 0.8rem;
      border: none;
      border-radius: 8px;
      background-color: #000;
      color: #fff;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: background-color 0.2s;
    }
    button:disabled { background-color: #888; cursor: not-allowed; }
    button.delete-btn { background-color: #e74c3c; width: auto; padding: 0.4rem 0.8rem; font-size: 0.8rem; }
    #status { text-align: center; margin-top: 1rem; font-weight: 500; }
    .success { color: #28a745; }
    .error { color: #dc3545; }
    #accountList { list-style: none; padding: 0; }
    .account-item {
      display: flex;
      align-items: center;
      padding: 1rem;
      border-bottom: 1px solid var(--light-gray);
    }
    .account-item:last-child { border-bottom: none; }
    .account-item img { width: 50px; height: 50px; border-radius: 50%; margin-right: 1rem; }
    .account-item .info { flex-grow: 1; }
    .account-item .name { font-weight: bold; }
    .account-item .username { color: #666; font-size: 0.9rem; }
  </style>
</head>
<body>

  <div class="container">
    <div class="panel">
      <h2>Add Account</h2>
      <form id="accountForm">
        <div class="form-group"><label for="name">Name*</label><input type="text" id="name" required></div>
        <div class="form-group"><label for="username">Username* (with @)</label><input type="text" id="username" required></div>
        <div class="form-group"><label for="bio">Bio</label><input type="text" id="bio"></div>
        <div class="form-group"><label for="avatar">Avatar URL</label><input type="url" id="avatar"></div>
        <div class="form-group"><label for="link">Profile Link*</label><input type="url" id="link" required></div>
        <button type="submit" id="submitBtn">Add Account</button>
      </form>
      <p id="status"></p>
    </div>
    <div class="panel">
      <h2>Existing Accounts</h2>
      <ul id="accountList">
        <p>Loading accounts...</p>
      </ul>
    </div>
  </div>

  <script>
    const API_BASE_URL = 'http://localhost:4000/api'; // The URL of your running API
    const form = document.getElementById('accountForm');
    const statusEl = document.getElementById('status');
    const submitBtn = document.getElementById('submitBtn');
    const accountList = document.getElementById('accountList');

    // --- FETCH AND DISPLAY ALL ACCOUNTS ---
    async function fetchAccounts() {
      try {
        // ✅ FIX: Changed 'igaccounts' to 'igaccounts'
        const response = await fetch(`${API_BASE_URL}/igaccounts`);
        const accounts = await response.json();
        renderAccounts(accounts);
      } catch (error) {
        accountList.innerHTML = `<p class="error">Error loading accounts. (Is the API server running?)</p>`;
        console.error(error);
      }
    }

    function renderAccounts(accounts) {
      accountList.innerHTML = ''; // Clear current list
      if (accounts.length === 0) {
        accountList.innerHTML = '<p>No accounts found.</p>';
        return;
      }
      accounts.forEach(acc => {
        const li = document.createElement('li');
        li.className = 'account-item';
        li.innerHTML = `
          <img src="${acc.avatar || 'https://placehold.co/50x50/eee/333?text=N/A'}" alt="${acc.name}">
          <div class="info">
            <div class="name">${acc.name}</div>
            <div class="username">${acc.username}</div>
          </div>
          <button class="delete-btn" data-id="${acc.id}">Delete</button>
        `;
        accountList.appendChild(li);
      });
    }

    // --- HANDLE FORM SUBMISSION (CREATE ACCOUNT) ---
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const data = {
        name: form.name.value,
        username: form.username.value,
        bio: form.bio.value,
        avatar: form.avatar.value,
        link: form.link.value,
      };

      submitBtn.disabled = true;
      submitBtn.textContent = 'Adding...';
      statusEl.textContent = '';

      try {
        // ✅ FIX: Changed 'igaccounts' to 'igaccounts'
        const response = await fetch(`${API_BASE_URL}/igaccounts`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data),
        });
        const result = await response.json();
        if (!response.ok) throw new Error(result.error);

        statusEl.textContent = 'Account added successfully!';
        statusEl.className = 'success';
        form.reset();
        fetchAccounts(); // Refresh the list
      } catch (error) {
        statusEl.textContent = `Error: ${error.message}`;
        statusEl.className = 'error';
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Add Account';
      }
    });

    // --- HANDLE DELETE BUTTON CLICKS ---
    accountList.addEventListener('click', async (e) => {
        if (e.target.classList.contains('delete-btn')) {
            const accountId = e.target.dataset.id;
            if (!confirm(`Are you sure you want to delete this account?`)) return;

            try {
                // ✅ FIX: Changed 'igaccounts' to 'igaccounts'
                const response = await fetch(`${API_BASE_URL}/igaccounts/${accountId}`, {
                    method: 'DELETE',
                });
                const result = await response.json();
                if (!response.ok) throw new Error(result.error);

                fetchAccounts(); // Refresh the list
            } catch (error) {
                alert(`Error deleting account: ${error.message}`);
            }
        }
    });


    // Initial load
    fetchAccounts();
  </script>

</body>
</html>
